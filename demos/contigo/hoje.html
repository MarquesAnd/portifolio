<script>
/* Local interactivity only: internal links jump between the static demo screens, keeping the language. */
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[data-demo]');
  if (a) { e.preventDefault(); location.href = a.getAttribute('data-demo') + '#' + (window.DEMO_LANG || 'en'); return; }
  var x = e.target.closest('a[href="#"]'); if (x) e.preventDefault();
});
</script>
<script>
/* The week strip: tap a day to see it pop, like the real spring animation. */
document.querySelectorAll('.semana .dia i').forEach(function(i){
  i.style.transition = 'transform .25s cubic-bezier(.2,.9,.3,1.15)';
  i.addEventListener('click', function(){ i.style.transform = 'scale(1.15)'; setTimeout(function(){ i.style.transform = ''; }, 220); });
});
</script>
